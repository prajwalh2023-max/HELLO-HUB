kind = "web"
previewPath = "/"
title = "DevPulse"
description = "A Streamlit developer productivity metrics dashboard aligned with the Software Metrics report, with demo data clearly labeled until GitHub access is configured."
version = "1.0.0"
id = "artifacts/devpulse"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21976

[services.development]
run = "uv run --project ../.. streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false"

[services.production]

[services.production.build]
args = [ "uv", "sync", "--project", "../..", "--frozen" ]

[services.production.run]
args = [ "uv", "run", "--project", "../..", "streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "21976", "--server.headless", "true", "--browser.gatherUsageStats", "false" ]

[services.production.run.env]
PORT = "21976"
BASE_PATH = "/"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "21976"
BASE_PATH = "/"
